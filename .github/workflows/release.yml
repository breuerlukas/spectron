name: Publish release

on:
  release:
    types: [ published ]

permissions:
  contents: write
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach jars to release
        run: |
          mkdir release && version=${GITHUB_REF_NAME#v}
          cp core/build/libs/core-$version.jar release/spectron-$version.jar
          gh release upload "${{ github.event.release.tag_name }}" release/*.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
